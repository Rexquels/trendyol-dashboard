```html
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Giriş Yap | Trendyol Operasyon Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            background: #f5f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1f2937;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 42px 38px;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
            border: 1px solid #e5e7eb;
        }

        .logo {
            width: 58px;
            height: 58px;
            margin: 0 auto 20px;
            border-radius: 15px;
            background: #f97316;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: #111827;
        }

        .subtitle {
            text-align: center;
            margin: 8px 0 30px;
            color: #6b7280;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.12);
        }

        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 11px 13px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .login-button {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 9px;
            background: #f97316;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .login-button:hover {
            background: #ea580c;
        }

        .login-button:active {
            transform: scale(0.99);
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #9ca3af;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 34px 24px;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <div class="logo">
            T
        </div>

        <h1>Trendyol Operasyon</h1>

        <div class="subtitle">
            Dashboard'a giriş yap
        </div>

        {% if form.errors %}
            <div class="error-message">
                Kullanıcı adı veya şifre hatalı.
                Lütfen bilgilerinizi kontrol edip tekrar deneyin.
            </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">

            {% csrf_token %}

            <div class="form-group">
                <label for="id_username">
                    Kullanıcı Adı
                </label>

                <input
                    type="text"
                    name="username"
                    id="id_username"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="id_password">
                    Şifre
                </label>

                <input
                    type="password"
                    name="password"
                    id="id_password"
                    autocomplete="current-password"
                    required
                >
            </div>

            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <button type="submit" class="login-button">
                Giriş Yap
            </button>

        </form>

        <div class="footer">
            Trendyol Operasyon Dashboard
        </div>

    </div>

</div>

</body>
</html>
```
